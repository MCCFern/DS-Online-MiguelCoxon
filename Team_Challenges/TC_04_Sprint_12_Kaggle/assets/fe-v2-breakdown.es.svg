<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 442" width="680" role="img" aria-labelledby="t d">
<title id="t">Feature engineering v2 frente a v1</title><desc id="d">Para cada columna cruda se muestra qué extraía la v1 y qué añade la v2, incluida la familia de producto rescatada de la columna que antes se descartaba.</desc>
<style>text{stroke:none;font-family:'Segoe UI',-apple-system,BlinkMacSystemFont,Roboto,Helvetica,Arial,sans-serif}.th{font-size:14px;font-weight:600;fill:#2A2A28}.ts{font-size:12px;font-weight:400;fill:#56554F}.bg{fill:#FCFBF9;stroke:#E8E6DF;stroke-width:1}.c-gray{fill:#F1EFE8;stroke:#C4C2B8}.c-teal{fill:#DEF3EB;stroke:#69C9AA}.c-purple{fill:#EBEAFD;stroke:#B1AAEE}</style>
<rect class="bg" x="0.5" y="0.5" width="679" height="441" rx="14"/>
<defs><marker id="ah" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#8A857D"/></marker></defs>
<text class="th" x="40" y="28">columna cruda (ejemplo)</text>
<text class="th" x="266" y="28">v1 extraía</text>
<text class="th" x="457" y="28">v2 añade</text>
<g class="c-gray"><rect x="40" y="46" width="205" height="46" rx="8" stroke-width="0.5"/><text class="th" x="52" y="65">Product</text><text class="ts" x="52" y="83">Legion Y520-15IKBN</text></g>
<line x1="249" y1="69" x2="262" y2="69" stroke="#8A857D" stroke-width="1.5" marker-end="url(#ah)"/>
<g class="c-gray"><rect x="266" y="46" width="170" height="46" rx="8" stroke-width="0.5"/><text class="ts" x="278" y="65">✗ descartada</text><text class="ts" x="278" y="83">(480 valores únicos)</text></g>
<line x1="440" y1="69" x2="453" y2="69" stroke="#8A857D" stroke-width="1.5" marker-end="url(#ah)"/>
<g class="c-purple"><rect x="457" y="46" width="183" height="46" rx="8" stroke-width="0.5"/><text class="ts" x="469" y="65">family = «legion»</text><text class="ts" x="469" y="83">~86 gamas → generaliza</text></g>
<g class="c-gray"><rect x="40" y="106" width="205" height="46" rx="8" stroke-width="0.5"/><text class="th" x="52" y="125">Cpu</text><text class="ts" x="52" y="143">Intel Core i7 7700HQ 2.8GHz</text></g>
<line x1="249" y1="129" x2="262" y2="129" stroke="#8A857D" stroke-width="1.5" marker-end="url(#ah)"/>
<g class="c-teal"><rect x="266" y="106" width="170" height="46" rx="8" stroke-width="0.5"/><text class="ts" x="278" y="125">marca · gama i7</text><text class="ts" x="278" y="143">2.8 GHz</text></g>
<line x1="440" y1="129" x2="453" y2="129" stroke="#8A857D" stroke-width="1.5" marker-end="url(#ah)"/>
<g class="c-purple"><rect x="457" y="106" width="183" height="46" rx="8" stroke-width="0.5"/><text class="ts" x="469" y="125">gen = 7 · sufijo = HQ</text><text class="ts" x="469" y="143">(U ≠ HQ: clase consumo)</text></g>
<g class="c-gray"><rect x="40" y="166" width="205" height="46" rx="8" stroke-width="0.5"/><text class="th" x="52" y="185">Gpu</text><text class="ts" x="52" y="203">Nvidia GeForce GTX 1060</text></g>
<line x1="249" y1="189" x2="262" y2="189" stroke="#8A857D" stroke-width="1.5" marker-end="url(#ah)"/>
<g class="c-teal"><rect x="266" y="166" width="170" height="46" rx="8" stroke-width="0.5"/><text class="ts" x="278" y="185">marca Nvidia</text><text class="ts" x="278" y="203">flag difuso gama alta</text></g>
<line x1="440" y1="189" x2="453" y2="189" stroke="#8A857D" stroke-width="1.5" marker-end="url(#ah)"/>
<g class="c-purple"><rect x="457" y="166" width="183" height="46" rx="8" stroke-width="0.5"/><text class="ts" x="469" y="185">num = 1060 · GTX</text><text class="ts" x="469" y="203">dedicada (marca ≠ Intel)</text></g>
<g class="c-gray"><rect x="40" y="226" width="205" height="46" rx="8" stroke-width="0.5"/><text class="th" x="52" y="245">ScreenResolution</text><text class="ts" x="52" y="263">IPS Retina 2560x1600</text></g>
<line x1="249" y1="249" x2="262" y2="249" stroke="#8A857D" stroke-width="1.5" marker-end="url(#ah)"/>
<g class="c-teal"><rect x="266" y="226" width="170" height="46" rx="8" stroke-width="0.5"/><text class="ts" x="278" y="254">res, PPI, IPS, táctil</text></g>
<line x1="440" y1="249" x2="453" y2="249" stroke="#8A857D" stroke-width="1.5" marker-end="url(#ah)"/>
<g class="c-purple"><rect x="457" y="226" width="183" height="46" rx="8" stroke-width="0.5"/><text class="ts" x="469" y="245">+ retina</text><text class="ts" x="469" y="263">(panel premium Apple)</text></g>
<g class="c-gray"><rect x="40" y="286" width="205" height="46" rx="8" stroke-width="0.5"/><text class="th" x="52" y="305">OpSys</text><text class="ts" x="52" y="323">Windows 10 S</text></g>
<line x1="249" y1="309" x2="262" y2="309" stroke="#8A857D" stroke-width="1.5" marker-end="url(#ah)"/>
<g class="c-teal"><rect x="266" y="286" width="170" height="46" rx="8" stroke-width="0.5"/><text class="ts" x="278" y="305">simplificado</text><text class="ts" x="278" y="323">→ «Windows»</text></g>
<line x1="440" y1="309" x2="453" y2="309" stroke="#8A857D" stroke-width="1.5" marker-end="url(#ah)"/>
<g class="c-purple"><rect x="457" y="286" width="183" height="46" rx="8" stroke-width="0.5"/><text class="ts" x="469" y="305">crudo: 10 ≠ 7 ≠ 10 S</text><text class="ts" x="469" y="323">(empresa vs gama básica)</text></g>
<g class="c-gray"><rect x="40" y="346" width="205" height="46" rx="8" stroke-width="0.5"/><text class="th" x="52" y="365">Weight · Inches</text><text class="ts" x="52" y="383">1.86kg · 14.0"</text></g>
<line x1="249" y1="369" x2="262" y2="369" stroke="#8A857D" stroke-width="1.5" marker-end="url(#ah)"/>
<g class="c-teal"><rect x="266" y="346" width="170" height="46" rx="8" stroke-width="0.5"/><text class="ts" x="278" y="365">peso = 1.86</text><text class="ts" x="278" y="383">pulgadas = 14.0</text></g>
<line x1="440" y1="369" x2="453" y2="369" stroke="#8A857D" stroke-width="1.5" marker-end="url(#ah)"/>
<g class="c-purple"><rect x="457" y="346" width="183" height="46" rx="8" stroke-width="0.5"/><text class="ts" x="469" y="365">peso/pulgada = 0.133</text><text class="ts" x="469" y="383">(densidad ≈ calidad)</text></g>
<g class="c-teal"><rect x="40" y="412" width="12" height="12" rx="3" stroke-width="0.5"/></g>
<text class="ts" x="58" y="422">formato traducido (v1)</text>
<g class="c-purple"><rect x="205" y="412" width="12" height="12" rx="3" stroke-width="0.5"/></g>
<text class="ts" x="223" y="422">identidad y posición en la gama (v2)</text>
<text class="ts" x="457" y="422">el resto del v1 se mantiene intacto</text>
</svg>